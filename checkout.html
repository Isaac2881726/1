<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Campus Eats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --hunter: #1F3823;
    --brick: #A8412C;
    --parchment: #EFE9DA;
    --gold: #C9A227;
    --ink: #2B2418;
    --white: #FFFFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--parchment);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .display {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    line-height: 1.05;
  }

  .nav-label, .eyebrow, .section-heading, .form-label {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
  }

  a { text-decoration: none; color: inherit; }
  img, svg { display: block; }

  /* ---------- NAV (matches homepage) ---------- */

  .navbar {
    background: var(--hunter);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 50;
    border-bottom: 3px solid var(--gold);
  }

  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand { display: flex; align-items: center; gap: 12px; }

  .brand-badge {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand-badge svg { width: 26px; height: 26px; }

  .wordmark {
    color: var(--white);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .nav-links { display: flex; align-items: center; gap: 28px; }

  .nav-label {
    color: var(--white);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1px;
    opacity: 0.92;
    padding: 6px 2px;
    border-bottom: 2px solid transparent;
  }

  .nav-label:hover { opacity: 1; border-bottom-color: var(--gold); }

  /* ---------- PAGE HEADER ---------- */

  .checkout-header {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 24px 8px;
  }

  .eyebrow {
    display: inline-block;
    border: 1.5px solid var(--brick);
    color: var(--brick);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.6px;
    padding: 6px 13px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .checkout-header h1 {
    font-size: clamp(28px, 4vw, 40px);
    text-transform: uppercase;
  }

  /* ---------- LAYOUT ---------- */

  .checkout-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 24px 80px;
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: 28px;
    align-items: start;
  }

  .card {
    background: var(--white);
    border: 1px solid rgba(43, 36, 24, 0.12);
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(43, 36, 24, 0.06);
    padding: 24px;
  }

  .section-heading {
    color: var(--brick);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2.5px;
    margin-bottom: 18px;
  }

  /* ---------- ORDER SUMMARY ---------- */

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(43, 36, 24, 0.08);
  }

  .summary-row:last-of-type { border-bottom: none; }

  .item-name { font-weight: 500; font-size: 15px; }
  .item-qty { color: rgba(43,36,24,0.55); font-size: 13px; margin-top: 2px; }
  .item-price { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 15px; }

  .summary-totals { margin-top: 12px; padding-top: 14px; border-top: 2px solid var(--ink); }

  .totals-line {
    display: flex;
    justify-content: space-between;
    font-size: 14.5px;
    padding: 6px 0;
    color: rgba(43,36,24,0.8);
  }

  .totals-line.grand {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    padding-top: 12px;
    border-top: 1px solid rgba(43,36,24,0.12);
    margin-top: 6px;
  }

  .totals-line.grand .amount { color: var(--brick); }

  .fee-note {
    font-size: 12px;
    color: rgba(43,36,24,0.5);
    margin-top: 4px;
  }

  /* ---------- FORM ELEMENTS ---------- */

  .form-block { margin-bottom: 26px; }
  .form-block:last-child { margin-bottom: 0; }

  .form-label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 1.4px;
    color: var(--hunter);
    margin-bottom: 12px;
  }

  .required-mark { color: var(--brick); }

  /* payment method radio cards */
  .radio-group { display: flex; flex-direction: column; gap: 12px; }

  .radio-card {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 2px solid rgba(43, 36, 24, 0.15);
    border-radius: 12px;
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    min-height: 56px;
  }

  .radio-card:hover { border-color: var(--gold); }

  .radio-card input[type="radio"] {
    width: 20px;
    height: 20px;
    accent-color: var(--brick);
    flex-shrink: 0;
    cursor: pointer;
  }

  .radio-card.selected {
    border-color: var(--brick);
    background: rgba(168, 65, 44, 0.05);
  }

  .radio-card-text .rc-title {
    font-weight: 600;
    font-size: 15px;
  }

  .radio-card-text .rc-sub {
    font-size: 12.5px;
    color: rgba(43,36,24,0.6);
    margin-top: 2px;
  }

  /* select + textarea + file */
  select, textarea {
    width: 100%;
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    color: var(--ink);
    background: var(--parchment);
    border: 2px solid rgba(43, 36, 24, 0.15);
    border-radius: 10px;
    padding: 14px 16px;
    min-height: 52px;
    transition: border-color 0.15s ease;
  }

  select:focus, textarea:focus {
    outline: none;
    border-color: var(--brick);
  }

  textarea { min-height: 90px; resize: vertical; }

  #locationDescBlock { display: none; margin-top: 14px; }
  #locationDescBlock.show { display: block; }

  .optional-tag {
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    color: rgba(43,36,24,0.5);
    font-size: 12px;
  }

  /* photo upload */
  .upload-box {
    border: 2px dashed rgba(43, 36, 24, 0.25);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    background: var(--parchment);
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  .upload-box:hover { border-color: var(--gold); }

  .upload-box input[type="file"] { display: none; }

  .upload-label {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    color: var(--hunter);
    letter-spacing: 0.6px;
  }

  .upload-hint {
    font-size: 12px;
    color: rgba(43,36,24,0.5);
    margin-top: 6px;
  }

  .upload-preview {
    margin-top: 14px;
    display: none;
  }

  .upload-preview.show { display: block; }

  .upload-preview img {
    max-width: 100%;
    max-height: 180px;
    border-radius: 10px;
    margin: 0 auto;
  }

  .upload-filename {
    font-size: 12.5px;
    color: var(--hunter);
    margin-top: 8px;
    font-weight: 500;
  }

  /* ---------- PLACE ORDER ---------- */

  .place-order-block { margin-top: 30px; }

  .btn-place-order {
    width: 100%;
    background: var(--brick);
    color: var(--white);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 1.2px;
    font-size: 16px;
    padding: 18px 24px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(168, 65, 44, 0.28);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    min-height: 58px;
  }

  .btn-place-order:hover {
    background: #8f371f;
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(168, 65, 44, 0.34);
  }

  .btn-place-order:active { transform: translateY(0); }

  .btn-place-order:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .form-error {
    display: none;
    background: rgba(168, 65, 44, 0.08);
    border: 1.5px solid var(--brick);
    color: var(--brick);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13.5px;
    font-weight: 500;
    margin-top: 14px;
  }

  .form-error.show { display: block; }

  .secure-note {
    text-align: center;
    font-size: 12px;
    color: rgba(43,36,24,0.5);
    margin-top: 14px;
  }

  /* ---------- RESPONSIVE ---------- */

  @media (max-width: 900px) {
    .checkout-wrap {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 640px) {
    .nav-links { display: none; }
    .checkout-header { padding: 28px 20px 4px; }
    .checkout-wrap { padding: 20px 20px 60px; gap: 20px; }
    .card { padding: 18px; }
  }
</style>
</head>
<body>

<!-- ============ NAV ============ -->
<header class="navbar">
  <div class="nav-inner">
    <div class="brand">
      <span class="brand-badge" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="14" r="6" fill="#FFFFFF"/>
          <path d="M32 21 L27 34 L20 40" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
          <path d="M32 21 L38 32 L47 26" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
          <path d="M27 34 L23 50" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
          <path d="M32 34 L38 49" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
          <rect x="12" y="36" width="12" height="8" rx="1" fill="#FFFFFF"/>
          <rect x="13.5" y="34" width="9" height="2" fill="#FFFFFF"/>
          <path d="M43 22 a6 6 0 0 1 12 0 z" fill="#FFFFFF"/>
          <rect x="41.5" y="22" width="15" height="2.4" rx="1.2" fill="#FFFFFF"/>
          <rect x="47.5" y="15" width="2" height="4" fill="#FFFFFF"/>
        </svg>
      </span>
      <span class="wordmark">Campus Eats</span>
    </div>
    <nav class="nav-links">
      <a class="nav-label" href="campuseats-menu.html">Menu</a>
      <a class="nav-label" href="#track">Track Order</a>
      <a class="nav-label" href="checkout.html">Checkout</a>
    </nav>
  </div>
</header>

<!-- ============ HEADER ============ -->
<div class="checkout-header">
  <span class="eyebrow">Almost there</span>
  <h1>Checkout</h1>
</div>

<!-- ============ MAIN LAYOUT ============ -->
<div class="checkout-wrap">

  <!-- ---------- ORDER SUMMARY ---------- -->
  <div class="card" id="orderSummaryCard">
    <h2 class="section-heading">Order Summary</h2>
    <div id="summaryItems"><!-- populated by JS --></div>

    <div class="summary-totals">
      <div class="totals-line">
        <span>Food Subtotal</span>
        <span id="subtotalAmount">R0</span>
      </div>
      <div class="totals-line">
        <span>Campus Eats Fee (10%)</span>
        <span id="feeAmount">R0</span>
      </div>
      <div class="totals-line grand">
        <span>Final Total</span>
        <span class="amount" id="totalAmount">R0</span>
      </div>
      <p class="fee-note">The Campus Eats fee helps cover runner delivery on foot or bike across campus.</p>
    </div>
  </div>

  <!-- ---------- DELIVERY DETAILS FORM ---------- -->
  <div class="card">
    <h2 class="section-heading">Delivery &amp; Payment Details</h2>

    <form id="checkoutForm" novalidate>

      <!-- Payment Method -->
      <div class="form-block">
        <label class="form-label">Payment Method <span class="required-mark">*</span></label>
        <div class="radio-group" id="paymentGroup">
          <label class="radio-card" data-radio-card>
            <input type="radio" name="paymentMethod" value="cash">
            <div class="radio-card-text">
              <div class="rc-title">Cash on Delivery</div>
              <div class="rc-sub">Pay the runner in cash when your order arrives</div>
            </div>
          </label>
          <label class="radio-card" data-radio-card>
            <input type="radio" name="paymentMethod" value="transaction">
            <div class="radio-card-text">
              <div class="rc-title">Transaction on Delivery</div>
              <div class="rc-sub">Bank transfer / e-wallet, confirmed on arrival</div>
            </div>
          </label>
        </div>
      </div>

      <!-- Delivery Location -->
      <div class="form-block">
        <label class="form-label" for="buildingSelect">Delivery Location <span class="required-mark">*</span></label>
        <select id="buildingSelect" name="building">
          <option value="" selected disabled>Select a building…</option>
          <option value="Wits Main Campus">Wits Main Campus</option>
          <option value="Wits Medical School">Wits Medical School</option>
          <option value="Wits Education Campus">Wits Education Campus</option>
          <option value="West Campus Residences">West Campus Residences</option>
          <option value="East Campus Residences">East Campus Residences</option>
          <option value="Matrix Mall">Matrix Mall</option>
          <option value="Wits Junction">Wits Junction</option>
          <option value="Library Lawns">Library Lawns</option>
          <option value="Other">Other (describe below)</option>
        </select>

        <div id="locationDescBlock">
          <label class="form-label" for="locationDesc" style="margin-top:14px;">
            Describe Your Location <span class="required-mark">*</span>
          </label>
          <textarea id="locationDesc" name="locationDesc" placeholder="e.g. Blue gate near the Chamber of Mines entrance, opposite the taxi rank"></textarea>
        </div>
      </div>

      <!-- Location Description (optional, shown for non-Other buildings) -->
      <div class="form-block" id="optionalNoteBlock">
        <label class="form-label" for="locationNote">
          Extra Directions <span class="optional-tag">(optional)</span>
        </label>
        <textarea id="locationNote" name="locationNote" placeholder="e.g. Room 214, ring the buzzer, meet at the Solomon Mahlangu House steps…"></textarea>
      </div>

      <!-- Photo Upload -->
      <div class="form-block">
        <label class="form-label" for="photoUpload">
          Photo of Yourself or Meeting Spot <span class="optional-tag">(optional)</span>
        </label>
        <label class="upload-box" for="photoUpload">
          <input type="file" id="photoUpload" name="photoUpload" accept="image/*" capture="environment">
          <div class="upload-label">📷 Tap to add a photo</div>
          <div class="upload-hint">Helps our runner spot you faster</div>
          <div class="upload-preview" id="uploadPreview">
            <img id="uploadPreviewImg" alt="Preview of uploaded photo">
            <div class="upload-filename" id="uploadFilename"></div>
          </div>
        </label>
      </div>

      <div class="form-error" id="formError"></div>

      <div class="place-order-block">
        <button type="submit" class="btn-place-order" id="placeOrderBtn">Place Order</button>
        <p class="secure-note">No card needed — pay the runner directly on arrival.</p>
      </div>

    </form>
  </div>

</div>

<script>
(function () {

  /* =========================================================
     STEP 1 — LOAD CART DATA
     Builds on top of the existing cart from campuseats-menu.html.
     That page keeps its cart in an in-page JS object, so we
     read from localStorage under the shared key "campusEatsCart"
     if the menu page has been updated to persist it there.
     If nothing is found (e.g. testing this page directly),
     fall back to dummy items so the page is always previewable.
  ========================================================= */

  const FEE_RATE = 0.10;
  let cartItems = [];

  function loadCart() {
    try {
      const stored = localStorage.getItem("campusEatsCart");
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed) && parsed.length > 0) {
          return parsed;
        }
      }
    } catch (e) {
      // ignore malformed storage, fall back to dummy data
    }
    // ---- dummy fallback cart ----
    return [
      { name: "Chicken Burger", price: 50, qty: 2 },
      { name: "Mega Kota", price: 50, qty: 1 },
      { name: "Sunshine Breakfast", price: 45, qty: 1 }
    ];
  }

  cartItems = loadCart();

  /* =========================================================
     STEP 2 — RENDER ORDER SUMMARY
  ========================================================= */

  const summaryItemsEl = document.getElementById("summaryItems");
  const subtotalEl = document.getElementById("subtotalAmount");
  const feeEl = document.getElementById("feeAmount");
  const totalEl = document.getElementById("totalAmount");

  function renderSummary() {
    summaryItemsEl.innerHTML = "";
    let subtotal = 0;

    cartItems.forEach(item => {
      const lineTotal = item.price * item.qty;
      subtotal += lineTotal;

      const row = document.createElement("div");
      row.className = "summary-row";
      row.innerHTML = `
        <div>
          <div class="item-name">${item.name}</div>
          <div class="item-qty">Qty ${item.qty} · R${item.price} each</div>
        </div>
        <div class="item-price">R${lineTotal}</div>
      `;
      summaryItemsEl.appendChild(row);
    });

    const fee = Math.round(subtotal * FEE_RATE * 100) / 100;
    const total = Math.round((subtotal + fee) * 100) / 100;

    subtotalEl.textContent = "R" + subtotal.toFixed(0);
    feeEl.textContent = "R" + fee.toFixed(2);
    totalEl.textContent = "R" + total.toFixed(2);

    return { subtotal, fee, total };
  }

  let currentTotals = renderSummary();

  /* =========================================================
     STEP 3 — PAYMENT METHOD RADIO CARDS
  ========================================================= */

  const paymentCards = document.querySelectorAll("#paymentGroup .radio-card");

  paymentCards.forEach(card => {
    const radio = card.querySelector("input[type=radio]");
    card.addEventListener("click", () => {
      paymentCards.forEach(c => c.classList.remove("selected"));
      radio.checked = true;
      card.classList.add("selected");
      clearError();
    });
  });

  /* =========================================================
     STEP 4 — CONDITIONAL "OTHER" LOCATION FIELD
  ========================================================= */

  const buildingSelect = document.getElementById("buildingSelect");
  const locationDescBlock = document.getElementById("locationDescBlock");
  const locationDesc = document.getElementById("locationDesc");
  const optionalNoteBlock = document.getElementById("optionalNoteBlock");

  function toggleLocationDesc() {
    if (buildingSelect.value === "Other") {
      locationDescBlock.classList.add("show");
      optionalNoteBlock.style.display = "none";
    } else {
      locationDescBlock.classList.remove("show");
      optionalNoteBlock.style.display = "block";
    }
    clearError();
  }

  buildingSelect.addEventListener("change", toggleLocationDesc);
  toggleLocationDesc();

  /* =========================================================
     STEP 5 — PHOTO UPLOAD PREVIEW
  ========================================================= */

  const photoInput = document.getElementById("photoUpload");
  const uploadPreview = document.getElementById("uploadPreview");
  const uploadPreviewImg = document.getElementById("uploadPreviewImg");
  const uploadFilename = document.getElementById("uploadFilename");

  photoInput.addEventListener("change", () => {
    const file = photoInput.files[0];
    if (!file) {
      uploadPreview.classList.remove("show");
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      uploadPreviewImg.src = e.target.result;
      uploadFilename.textContent = file.name;
      uploadPreview.classList.add("show");
    };
    reader.readAsDataURL(file);
  });

  /* =========================================================
     STEP 6 — VALIDATION + PLACE ORDER
  ========================================================= */

  const form = document.getElementById("checkoutForm");
  const errorBox = document.getElementById("formError");
  const placeOrderBtn = document.getElementById("placeOrderBtn");

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add("show");
    errorBox.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function clearError() {
    errorBox.classList.remove("show");
    errorBox.textContent = "";
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    clearError();

    const selectedPayment = form.querySelector('input[name="paymentMethod"]:checked');
    const building = buildingSelect.value;

    if (!selectedPayment) {
      showError("Please choose a payment method before placing your order.");
      return;
    }

    if (!building) {
      showError("Please select a delivery location before placing your order.");
      return;
    }

    if (building === "Other" && locationDesc.value.trim() === "") {
      showError("Please describe your delivery location so our runner can find you.");
      locationDesc.focus();
      return;
    }

    // ---- build mock order payload ----
    const order = {
      items: cartItems,
      totals: currentTotals,
      paymentMethod: selectedPayment.value,
      building: building,
      locationDetail: building === "Other" ? locationDesc.value.trim() : document.getElementById("locationNote").value.trim(),
      hasPhoto: photoInput.files.length > 0,
      placedAt: new Date().toISOString()
    };

    try {
      localStorage.setItem("campusEatsLastOrder", JSON.stringify(order));
    } catch (e) {
      // storage unavailable — continue anyway, this is a mock flow
    }

    placeOrderBtn.disabled = true;
    placeOrderBtn.textContent = "Placing Order…";

    // mock redirect to order tracking
    setTimeout(() => {
      window.location.href = "order-tracking.html";
    }, 600);
  });

})();
</script>

</body>
</html>
